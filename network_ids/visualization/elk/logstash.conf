# Logstash Configuration for NIDS
# ============================================================
# Parse Suricata EVE JSON and Snort logs for Elasticsearch
# ============================================================

input {
  # Suricata EVE JSON logs
  file {
    path => "/var/log/suricata/eve.json"
    start_position => "beginning"
    sincedb_path => "/var/log/logstash/suricata.sincedb"
    codec => "json"
    tags => ["suricata", "eve"]
  }

  # Snort fast alert logs
  file {
    path => "/var/log/snort/alert"
    start_position => "beginning"
    sincedb_path => "/var/log/logstash/snort.sincedb"
    codec => "plain"
    tags => ["snort", "fast"]
  }

  # Alert Manager logs
  file {
    path => "/var/log/nids/alert_manager.log"
    start_position => "beginning"
    sincedb_path => "/var/log/logstash/alert_manager.sincedb"
    codec => "plain"
    tags => ["alert_manager"]
  }

  # Responder logs
  file {
    path => "/var/log/nids/*.log"
    start_position => "beginning"
    sincedb_path => "/var/log/logstash/responders.sincedb"
    codec => "plain"
    tags => ["responders"]
  }
}

filter {
  # Parse Suricata EVE JSON
  if "suricata" in [tags] {
    # Ensure timestamp is parsed
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Extract alert fields
    if [event_type] == "alert" {
      mutate {
        add_field => {
          "alert_severity" => "%{[alert][severity]}"
          "alert_category" => "%{[alert][category]}"
          "alert_signature_id" => "%{[alert][signature_id]}"
          "alert_signature" => "%{[alert][signature]}"
        }
      }

      # Map severity
      mutate {
        add_field => {
          "severity_label" => "%{[alert][severity]}"
        }
      }

      # Map numeric severity to label
      translate {
        field => "[alert][severity]"
        destination => "severity_label"
        dictionary => {
          "1" => "high"
          "2" => "medium"
          "3" => "low"
        }
        fallback => "unknown"
      }
    }

    # Parse HTTP fields
    if [http] {
      mutate {
        add_field => {
          "http_method" => "%{[http][http_method]}"
          "http_hostname" => "%{[http][hostname]}"
          "http_url" => "%{[http][url]}"
          "http_user_agent" => "%{[http][http_user_agent]}"
          "http_status" => "%{[http][status]}"
          "http_content_type" => "%{[http][content_type]}"
        }
      }
    }

    # Parse DNS fields
    if [dns] {
      mutate {
        add_field => {
          "dns_query" => "%{[dns][query]}"
          "dns_type" => "%{[dns][type]}"
          "dns_rcode" => "%{[dns][rcode]}"
          "dns_ttl" => "%{[dns][ttl]}"
        }
      }

      # Extract query length
      if [dns][query] {
        ruby {
          code => "event.set('dns_query_length', event.get('[dns][query]').length)"
        }
      }
    }

    # Parse TLS fields
    if [tls] {
      mutate {
        add_field => {
          "tls_version" => "%{[tls][version]}"
          "tls_cipher" => "%{[tls][cipher]}"
          "tls_sni" => "%{[tls][sni]}"
          "tls_ja3" => "%{[tls][ja3][hash]}"
        }
      }
    }

    # Parse SSH fields
    if [ssh] {
      mutate {
        add_field => {
          "ssh_client" => "%{[ssh][client]}"
          "ssh_server" => "%{[ssh][server]}"
          "ssh_kex" => "%{[ssh][kex]}"
          "ssh_cipher" => "%{[ssh][cipher]}"
        }
      }
    }

    # GeoIP enrichment
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "geoip"
        database => "/usr/share/logstash/GeoLite2-City.mmdb"
        add_field => {
          "[geoip][location]" => "%{[geoip][longitude]},%{[geoip][latitude]}"
        }
      }
    }

    if [dest_ip] {
      geoip {
        source => "dest_ip"
        target => "dest_geoip"
        database => "/usr/share/logstash/GeoLite2-City.mmdb"
      }
    }

    # Add flow hash for correlation
    if [flow_id] {
      mutate {
        add_field => { "flow_id" => "%{flow_id}" }
      }
    }
  }

  # Parse Snort fast alert format
  if "snort" in [tags] {
    # Fast alert format: [**] [1:1000001:2] Rule Message [**] [Priority: 1] {TCP} 192.168.1.1:1234 -> 192.168.1.2:80
    grok {
      match => {
        "message" => "\[\*\*\] \[%{INT:gid}:%{INT:sid}:%{INT:rev}\] %{GREEDYDATA:msg} \[\*\*\] \[Priority: %{INT:priority}\] \{%{DATA:proto}\} %{IP:src_ip}:%{INT:src_port} -> %{IP:dest_ip}:%{INT:dest_port}"
      }
    }

    if "_grokparsefailure" not in [tags] {
      mutate {
        add_field => {
          "source" => "snort"
          "rule_id" => "%{sid}"
          "rule_rev" => "%{rev}"
          "rule_msg" => "%{msg}"
          "priority" => "%{priority}"
          "protocol" => "%{proto}"
        }
      }

      # Convert priority to severity
      translate {
        field => "priority"
        destination => "severity"
        dictionary => {
          "1" => "high"
          "2" => "medium"
          "3" => "low"
        }
        fallback => "medium"
      }

      # Parse timestamp from log (if available)
      date {
        match => ["timestamp", "MMM dd HH:mm:ss"]
        target => "@timestamp"
        locale => "en"
      }
    }
  }

  # Parse Alert Manager logs
  if "alert_manager" in [tags] {
    # Parse JSON log lines
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed] {
      mutate {
        add_field => {
          "alert_timestamp" => "%{[parsed][timestamp]}"
          "alert_rule_id" => "%{[parsed][rule_id]}"
          "alert_severity" => "%{[parsed][severity]}"
          "alert_src_ip" => "%{[parsed][src_ip]}"
          "alert_dst_ip" => "%{[parsed][dst_ip]}"
        }
      }
    }
  }

  # Parse responder logs
  if "responders" in [tags] {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}"
      }
    }

    mutate {
      add_field => { "source" => "responder" }
    }
  }

  # Add metadata
  mutate {
    add_field => {
      "environment" => "production"
      "sensor_name" => "${HOSTNAME}"
      "sensor_type" => "nids"
    }
  }

  # Drop unnecessary fields
  mutate {
    remove_field => ["message", "@version", "host", "path", "tags"]
  }
}

output {
  # Elasticsearch output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "suricata-%{+YYYY.MM.dd}"
    document_type => "_doc"
    template_name => "suricata"
    template => "/usr/share/logstash/templates/suricata.json"
    template_overwrite => true
    manage_template => true
    ilm_enabled => true
    ilm_policy => "suricata-policy"
    ilm_rollover_alias => "suricata"
  }

  # Debug output (comment out in production)
  # stdout { codec => rubydebug }