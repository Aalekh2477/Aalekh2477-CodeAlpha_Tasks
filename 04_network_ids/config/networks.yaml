# Network Configuration for NIDS
# ============================================================
# Define network zones, interfaces, and traffic policies
# ============================================================

networks:
  # Primary monitored network
  - name: "CORP_LAN"
    description: "Corporate LAN"
    interface: "eth0"
    cidr: "192.168.1.0/24"
    vlan: 10
    gateway: "192.168.1.1"
    dns_servers:
      - "192.168.1.10"
      - "192.168.1.11"
    dhcp_range: "192.168.1.100-192.168.1.200"
    critical_assets:
      - "192.168.1.10"   # Domain Controller
      - "192.168.1.11"   # Backup DC
      - "192.168.1.20"   # File Server
      - "192.168.1.30"   # Database Server
      - "192.168.1.40"   # Email Server

  # DMZ Network
  - name: "DMZ"
    description: "Demilitarized Zone - Public Services"
    interface: "eth1"
    cidr: "10.0.1.0/24"
    vlan: 20
    gateway: "10.0.1.1"
    public_services:
      - "10.0.1.10"   # Web Server
      - "10.0.1.11"   # Mail Gateway
      - "10.0.1.12"   # VPN Concentrator
      - "10.0.1.13"   # API Gateway

  # Management Network
  - name: "MGMT"
    description: "Out-of-band Management"
    interface: "eth2"
    cidr: "10.0.10.0/24"
    vlan: 99
    gateway: "10.0.10.1"
    allowed_protocols:
      - "SSH"
      - "HTTPS"
      - "SNMP"
      - "SYSLOG"
    devices:
      - "10.0.10.10"   # Switch Core
      - "10.0.10.11"   # Firewall
      - "10.0.10.12"   # NAC Appliance
      - "10.0.10.13"   # Monitoring Server

  # Guest Network
  - name: "GUEST"
    description: "Guest WiFi Network"
    interface: "eth3"
    cidr: "172.16.1.0/24"
    vlan: 50
    gateway: "172.16.1.1"
    isolation: true
    rate_limit: "10Mbps"

  # IoT/OT Network
  - name: "OT_NETWORK"
    description: "Operational Technology / IoT"
    interface: "eth4"
    cidr: "10.0.100.0/24"
    vlan: 100
    gateway: "10.0.100.1"
    protocols:
      - "Modbus/TCP"
      - "DNP3"
      - "OPC-UA"
      - "MQTT"
    devices:
      - "10.0.100.10"  # PLC Controller
      - "10.0.100.11"  # HMI Station
      - "10.0.100.12"  # Historian
      - "10.0.100.13"  # IoT Gateway

# Suricata HOME_NET / EXTERNAL_NET variables
# These override the defaults in suricata.yaml
vars:
  HOME_NET: "[192.168.1.0/24,10.0.1.0/24,10.0.10.0/24,172.16.1.0/24,10.0.100.0/24]"
  EXTERNAL_NET: "!$HOME_NET"
  HTTP_SERVERS: "[192.168.1.20,10.0.1.10,10.0.1.11]"
  SMTP_SERVERS: "[192.168.1.40,10.0.1.11]"
  SQL_SERVERS: "[192.168.1.30]"
  DNS_SERVERS: "[192.168.1.10,192.168.1.11]"
  SSH_SERVERS: "[192.168.1.10,192.168.1.11,10.0.10.10,10.0.10.11]"
  DC_SERVERS: "[192.168.1.10,192.168.1.11]"

# Port groups (override defaults if needed)
port-groups:
  HTTP_PORTS: "80,81,311,3128,8000,8080,8081,8082,8085,8088,8090,8888,9000,9080,9090,9091,9443"
  HTTPS_PORTS: "443,8443,9443"
  SSH_PORTS: "22,2222"
  RDP_PORTS: "3389"
  DATABASE_PORTS: "1433,1521,3306,5432,6379,27017"
  MAIL_PORTS: "25,465,587,993,995"
  DNS_PORTS: "53"
  VPN_PORTS: "1194,500,4500,1723"
  VOIP_PORTS: "5060,5061"

# Traffic policies per network
policies:
  CORP_LAN:
    alert_on:
      - sql_injection
      - xss
      - command_injection
      - brute_force
      - data_exfiltration
      - malware_c2
    block_on:
      - confirmed_malware
      - confirmed_exploit
      - confirmed_c2
    rate_limits:
      dns_queries: 1000/minute
      http_requests: 5000/minute
      smtp_connections: 100/minute

  DMZ:
    alert_on:
      - sql_injection
      - xss
      - command_injection
      - web_shell
      - file_upload
      - brute_force
    block_on:
      - confirmed_exploit
      - webshell_detected
    rate_limits:
      http_requests: 10000/minute
      api_calls: 5000/minute

  MGMT:
    alert_on:
      - unauthorized_access
      - brute_force
      - config_change
      - privileged_escalation
    block_on:
      - any_unauthorized_access
    rate_limits:
      ssh_connections: 10/minute
      https_requests: 100/minute

  GUEST:
    alert_on:
      - malware
      - phishing
      - suspicious_dns
    block_on:
      - confirmed_malware
      - c2_communication
    isolation: true
    rate_limits:
      total_bandwidth: "10Mbps"
      dns_queries: 100/minute

  OT_NETWORK:
    alert_on:
      - modbus_unauthorized
      - dnp3_unauthorized
      - plc_program_change
      - unauthorized_device
      - lateral_movement
    block_on:
      - confirmed_ot_attack
    rate_limits:
      modbus_requests: 1000/minute
      mqtt_messages: 500/minute

# Monitoring exclusions (reduce noise)
exclusions:
  # Backup traffic
  - src: "192.168.1.20"
    dst: "192.168.1.50"
    protocol: "TCP"
    ports: "445,2049"
    reason: "Backup server to storage"

  # Monitoring traffic
  - src: "10.0.10.13"
    reason: "Monitoring server"

  # DNS to internal servers
  - dst_port: 53
    dst_ip:
      - "192.168.1.10"
      - "192.168.1.11"
    reason: "Internal DNS"

  # NTP
  - dst_port: 123
    protocol: "UDP"
    reason: "Time synchronization"

# GeoIP-based policies
geoip:
  block_countries:
    - "KP"  # North Korea
    - "IR"  # Iran
    - "SY"  # Syria
  alert_countries:
    - "CN"  # China
    - "RU"  # Russia
    - "KP"  # North Korea
    - "IR"  # Iran
  whitelist_countries:
    - "US"
    - "CA"
    - "GB"
    - "DE"
    - "FR"
    - "AU"
    - "JP"